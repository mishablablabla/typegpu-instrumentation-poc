name: CI

# No GPU and no browser are used here: GitHub-hosted runners have neither a usable GPU nor a way to
# validate real-device behaviour. The real-device run (real-gpu/) stays a manual, recorded step.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly: upstream may have moved under the patch

permissions:
  contents: read

jobs:
  checks:
    name: setup, mock tests, tsc, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # upstream pins pnpm in its package.json (`packageManager`); corepack picks that exact version
      - run: corepack enable
      - name: Set up the patched TypeGPU checkout
        run: scripts/setup.sh
      - name: Tests, type check, lint
        run: scripts/check.sh

  upstream-drift:
    name: patch + overlay work on upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      # applies the patch to the current tip of upstream main, installs, runs the instrumentation tests and tsc
      - run: scripts/check-drift-full.sh

  packaging:
    name: built package, bundle matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: scripts/setup.sh && scripts/setup-pristine.sh
      # the bundle matrix takes webpack / the rollup plugins / terser from the upstream pnpm store; the
      # filtered setup above does not install them (they belong to apps/treeshake-test and @typegpu/noise)
      - run: cd .work/typegpu && pnpm install --frozen-lockfile --filter "treeshake-test..." --filter "@typegpu/noise..."
      # offline from here on: packs the built package, type-checks a consumer against it, bundles with four bundlers
      - run: package-test/run.sh
      - name: Fail on any recorded FAIL
        run: "! grep -q FAIL package-test/results/k1.log"
