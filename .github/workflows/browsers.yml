name: Browsers and platforms

# The base CI (ci.yml) runs on Linux with no browser. This workflow answers the cross-platform question that the
# one-Mac validation could not: the instrumentation tests on Linux/Windows/macOS, and the 130-check viability suite
# (plus the 20-check real-device suite where a browser can be driven over CDP) in Chrome, Edge, Firefox and Safari.
#
# GitHub-hosted runners have no GPU. A browser that finds no WebGPU adapter is recorded as `not-run`; one that finds a
# software adapter (SwiftShader, WARP) is recorded as `software`. Neither is real-GPU validation, and the summary says so.
# The page is built once and the byte-identical build is served in every cell.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 2'

permissions:
  contents: read

jobs:
  build-page:
    name: build the browser page once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: scripts/setup.sh
      - name: Build the page
        run: |
          source scripts/env.sh
          cd "$PKG"
          node tests/instrumentation/real-gpu-page/build.mjs "$GITHUB_WORKSPACE/page-dist" "$PKG/tests/instrumentation/examples/compute-scale.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: page-dist
          path: page-dist
          if-no-files-found: error

  mock-tests:
    name: mock tests, tsc, lint (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      # keep LF in patch files: a CRLF checkout on Windows would make `git apply` fail
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: scripts/setup.sh
      - run: scripts/check.sh
      - name: Record the result
        if: always()
        run: |
          mkdir -p ci-results
          printf '{"kind":"mock","os":"%s","node":"%s","status":"%s"}\n' "${{ matrix.os }}" "$(node --version)" "${{ job.status }}" > "ci-results/mock-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-${{ matrix.os }}
          path: ci-results

  browsers:
    name: ${{ matrix.cell }}
    needs: build-page
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: chrome-linux-swiftshader
            os: ubuntu-latest
            kind: chrome
            exe: /usr/bin/google-chrome
            args: --chrome-arg=--no-sandbox --chrome-arg=--enable-unsafe-webgpu --chrome-arg=--enable-features=Vulkan --chrome-arg=--use-angle=swiftshader --chrome-arg=--use-webgpu-adapter=swiftshader --chrome-arg=--enable-unsafe-swiftshader
          - cell: chrome-linux-lavapipe
            os: ubuntu-latest
            kind: chrome
            exe: /usr/bin/google-chrome
            args: --chrome-arg=--no-sandbox --chrome-arg=--enable-unsafe-webgpu --chrome-arg=--enable-features=Vulkan --chrome-arg=--use-angle=vulkan --chrome-arg=--disable-vulkan-surface
          - cell: chrome-windows-default
            os: windows-latest
            kind: chrome
            exe: C:\Program Files\Google\Chrome\Application\chrome.exe
            args: --chrome-arg=--enable-unsafe-webgpu --chrome-arg=--ignore-gpu-blocklist
          - cell: chrome-windows-swiftshader
            os: windows-latest
            kind: chrome
            exe: C:\Program Files\Google\Chrome\Application\chrome.exe
            args: --chrome-arg=--enable-unsafe-webgpu --chrome-arg=--use-angle=swiftshader --chrome-arg=--use-webgpu-adapter=swiftshader --chrome-arg=--enable-unsafe-swiftshader
          - cell: edge-windows-default
            os: windows-latest
            kind: chrome
            exe: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
            args: --chrome-arg=--enable-unsafe-webgpu --chrome-arg=--ignore-gpu-blocklist
          - cell: chrome-macos-default
            os: macos-latest
            kind: chrome
            exe: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
            args: --chrome-arg=--enable-unsafe-webgpu
          - cell: chrome-macos-swiftshader
            os: macos-latest
            kind: chrome
            exe: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
            args: --chrome-arg=--enable-unsafe-webgpu --chrome-arg=--use-angle=swiftshader --chrome-arg=--use-webgpu-adapter=swiftshader --chrome-arg=--enable-unsafe-swiftshader
          - cell: firefox-windows-fallback
            query: '?forceFallback=1'
            os: windows-latest
            kind: firefox
            exe: C:\Program Files\Mozilla Firefox\firefox.exe
          - cell: firefox-linux-fallback
            query: '?forceFallback=1'
            os: ubuntu-latest
            kind: firefox
            exe: /usr/bin/firefox
          - cell: firefox-macos-fallback
            query: '?forceFallback=1'
            os: macos-latest
            kind: firefox
            exe: /Applications/Firefox.app/Contents/MacOS/firefox
          - cell: safari-macos
            os: macos-latest
            kind: safari
          - cell: safari-macos-fallback
            os: macos-latest
            kind: safari
            query: '?forceFallback=1'
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: page-dist
          path: page-dist
      - name: Software Vulkan (lavapipe) for the Linux cells
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 && vulkaninfo --summary 2>/dev/null | head -20 || true
      - name: Show the browser
        run: |
          if [ -n "${{ matrix.exe }}" ]; then
            ls -la "${{ matrix.exe }}" || echo "browser binary not found at the expected path"
            # `chrome.exe --version` opens a window on Windows and never returns; read the file version instead
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command "(Get-Item '${{ matrix.exe }}').VersionInfo.ProductVersion"
            else
              "${{ matrix.exe }}" --version 2>/dev/null || true
            fi
          fi
          sw_vers 2>/dev/null || true
      - name: Run the cell
        run: |
          EXE_OPT=()
          if [ -n "${{ matrix.exe }}" ]; then EXE_OPT=(--exe "${{ matrix.exe }}"); fi
          QUERY_OPT=()
          if [ -n "${{ matrix.query }}" ]; then QUERY_OPT=(--query "${{ matrix.query }}"); fi
          node real-gpu/ci-cell.mjs --cell "${{ matrix.cell }}" --kind "${{ matrix.kind }}" "${EXE_OPT[@]}" "${QUERY_OPT[@]}" --prebuilt page-dist ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-${{ matrix.cell }}
          path: real-gpu/results/ci

  summary:
    name: results table
    needs: [mock-tests, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: ci-results
      - run: node scripts/ci-summary.mjs ci-results "$GITHUB_STEP_SUMMARY"
